services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_SECRET: ${SYNC_SECRET}
      PORT: 3000

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "5555:80"
    depends_on:
      - api

  agent:
    build:
      context: ./agent
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SYNC_SECRET: ${SYNC_SECRET}
      API_URL: http://api:3000
    depends_on:
      - api
